<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title><meta name="description" content="{{description}}"><meta property="og:type" content="website"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{title}}"><meta name="twitter:description" content="{{description}}">
{% if image %}<meta property="og:image" content="{{image}}"><meta name="twitter:image" content="{{image}}">{% endif %}
<style>*{box-sizing:border-box}body{margin:0;background:#0f1115;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif}.shell{max-width:480px;margin:auto;min-height:100vh;background:#fff;color:#111}header{padding:14px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between}header strong{font-size:14px}header span{font-size:11px;color:#6b7280}h1{font-size:20px;margin:14px 14px 4px}.mt{font-size:11px;color:#6b7280;margin:0 14px 14px}.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #e5e7eb}.thumb{width:56px;height:56px;flex:0 0 56px;object-fit:cover;border-radius:7px;background:#f3f4f6;display:grid;place-items:center;font-size:23px}.meta{min-width:0;flex:1}.name{font-size:12px;font-weight:600;overflow-wrap:anywhere}.date{font-size:10px;color:#6b7280;margin:3px 0}.links{font-size:11px;margin-top:5px}.links a{color:#2563eb;margin-right:12px}.sz{font-size:10px;color:#6b7280;white-space:nowrap}.status{padding:20px 14px;text-align:center;font-size:12px;color:#6b7280}.button{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;cursor:pointer}footer{text-align:center;padding:22px 10px;font-size:10px;color:#6b7280}</style>
</head><body><div class="shell"><header><strong>Gofile</strong><button class="button" id="refresh">更新</button></header><h1>{{title}}</h1><div class="mt"><span id="count">—</span> items ・ public</div><div id="list"></div><div id="status" class="status">読み込み中…</div><footer>公開が許可されたファイルのみ掲載してください</footer></div>
<script>
const el=document.getElementById('list'),status=document.getElementById('status');
function size(n){if(n===null||n===undefined)return '—';let x=Number(n);if(!Number.isFinite(x))return '—';for(const u of ['B','KB','MB','GB','TB']){if(x<1024)return `${Math.round(x*10)/10} ${u}`;x/=1024}return `${x.toFixed(1)} PB`}
function date(ts){if(!ts)return '';let n=Number(ts);if(!Number.isFinite(n))return '';return new Date(n*1000).toLocaleDateString('ja-JP')}
function node(tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e}
function render(f){const r=node('div','row');const th=f.thumb?node('img','thumb'):node('div','thumb',f.folder?'📁':'🎬');if(f.thumb){th.src=f.thumb;th.alt='';th.loading='lazy';th.onerror=()=>{th.replaceWith(node('div','thumb',f.folder?'📁':'🎬'))}}r.append(th);const m=node('div','meta');m.append(node('div','name',f.name),node('div','date',date(f.date)));const links=node('div','links');const a=node('a','','Gofileで開く');a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';links.append(a);m.append(links);r.append(m,node('div','sz',size(f.size)));return r}
async function load(){status.textContent='読み込み中…';el.replaceChildren();try{const r=await fetch('/api/files',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得失敗');document.getElementById('count').textContent=d.total;for(const f of d.files)el.append(render(f));status.textContent=d.files.length?'— 以上 —':'フォルダ内に表示可能なファイルがありません';}catch(e){status.textContent=e.message}}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
